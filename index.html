<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leduc Hold'em — Play vs AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Theme variables ───────────────────────────────────────────── */
:root {
  --bg:           #1a1a1a;
  --surface:      #2a2a2a;
  --surface-hi:   #2e2e2e;
  --hover:        #3a3a3a;
  --pressed:      #444;
  --border:       #444;
  --border-focus: #666;
  --border-dim:   #2a2a2a;
  --text:         #ddd;
  --text-btn:     #ccc;
  --text-hi:      #eee;
  --text-mid:     #aaa;
  --text-muted:   #888;
  --text-dim:     #666;
  --text-faint:   #555;
  --text-info:    #bbb;
  --text-hist:    #777;
  --text-desc:    #999;
  --win:          #55dd55;
  --loss:         #dd5555;
  --draw:         #aaaaaa;
  --ai:           #c8be44;
  --err:          #f66;
  --empty:        #3a3a3a;
  --mp-bg:        #1e1e1e;
  --kbd-bg:       #333;
  --kbd-border:   #555;
  --card-border:  #888;
}

body.light {
  --bg:           #f5f5f5;
  --surface:      #e8e8e8;
  --surface-hi:   #e0e0e0;
  --hover:        #d4d4d4;
  --pressed:      #c8c8c8;
  --border:       #bbb;
  --border-focus: #888;
  --border-dim:   #ddd;
  --text:         #1a1a1a;
  --text-btn:     #333;
  --text-hi:      #111;
  --text-mid:     #555;
  --text-muted:   #777;
  --text-dim:     #888;
  --text-faint:   #aaa;
  --text-info:    #333;
  --text-hist:    #666;
  --text-desc:    #666;
  --win:          #1a8a1a;
  --loss:         #cc2222;
  --draw:         #777;
  --ai:           #7a6a00;
  --err:          #c00;
  --empty:        #bbb;
  --mp-bg:        #ebebeb;
  --kbd-bg:       #e0e0e0;
  --kbd-border:   #bbb;
}

body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
}

h1 {
    font-size: 16px;
    font-weight: normal;
    color: var(--text-muted);
    margin-bottom: 20px;
    letter-spacing: 0.05em;
}

/* ── Controls ──────────────────────────────────────────────────── */
#controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    outline: none;
}
select:focus { border-color: var(--border-focus); }
select:disabled { opacity: 0.5; cursor: default; }

.btn {
    background: var(--surface-hi);
    color: var(--text-btn);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.1s;
}
.btn:hover { background: var(--hover); border-color: var(--border-focus); }
.btn:active { background: var(--pressed); }

.btn-action {
    padding: 8px 18px;
    font-size: 14px;
    color: var(--text-hi);
    border-color: var(--border);
}
.btn-next {
    padding: 8px 20px;
    font-size: 14px;
    border-color: var(--border);
}

kbd {
    background: var(--kbd-bg);
    border: 1px solid var(--kbd-border);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 11px;
    color: var(--text-mid);
    font-family: inherit;
}

#sep { width: 1px; height: 24px; background: var(--pressed); }

#stats {
    font-size: 13px;
    color: var(--text-mid);
    min-width: 150px;
}

#status {
    font-size: 13px;
}
#status.error { color: var(--err); }
#status.loading { color: var(--text-mid); }

/* ── Cards row ─────────────────────────────────────────────────── */
#cards-row {
    display: flex;
    gap: 20px;
    align-items: flex-end;
    margin-bottom: 20px;
}

.card-slot label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
}

.card {
    width: 58px;
    height: 84px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: 'Georgia', serif;
}

.card-face {
    background: #fff;
    border: 1px solid var(--card-border);
    color: #111;
}

.card-back {
    background: #1a3680;
    border: 1px solid #2a4a9a;
}
.card-back::after {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid #2a4a9a;
    border-radius: 3px;
}

.card-back.clickable {
    cursor: pointer;
    transition: background 0.1s;
}
.card-back.clickable:hover { background: #204090; }
.card-back.clickable::before {
    content: 'click';
    position: absolute;
    bottom: 8px;
    font-size: 9px;
    color: #6888cc;
    font-family: monospace;
    z-index: 1;
}

.card-empty {
    background: transparent;
    border: 1.5px dashed var(--empty);
    color: var(--empty);
    font-size: 22px;
}

.rank-corner {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 11px;
    line-height: 1;
    color: #333;
}

.rank-center {
    font-size: 32px;
    font-weight: bold;
    line-height: 1;
    margin-bottom: 2px;
}

.suit-center {
    font-size: 16px;
    line-height: 1;
}

/* ── Game info ─────────────────────────────────────────────────── */
#game-info {
    margin-bottom: 16px;
    min-height: 210px; /* round + position + R1 + R2 + AI action + result chip/desc */
}

.info-row {
    font-size: 14px;
    color: var(--text-info);
    margin-bottom: 4px;
}
.dim { color: var(--text-dim); font-size: 12px; }

.history {
    font-size: 12px;
    color: var(--text-hist);
    margin-bottom: 2px;
}

.ai-action {
    font-size: 13px;
    color: var(--ai);
    margin-top: 6px;
}

/* ── Result ────────────────────────────────────────────────────── */
#result-area { min-height: 70px; margin-bottom: 12px; }

.result {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 4px;
}

.chips {
    font-size: 36px;
    font-weight: bold;
    line-height: 1;
}

.win  .chips { color: var(--win); }
.loss .chips { color: var(--loss); }
.draw .chips { color: var(--draw); }

.desc { font-size: 14px; color: var(--text-desc); }

/* ── Actions ───────────────────────────────────────────────────── */
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── Separator ─────────────────────────────────────────────────── */
#divider {
    border: none;
    border-top: 1px solid var(--border-dim);
    margin: 20px 0;
}

/* ── History ───────────────────────────────────────────────────── */
#history-section {
    margin-top: 32px;
}

#history-section summary {
    font-size: 12px;
    color: var(--text-faint);
    cursor: pointer;
    user-select: none;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
}
#history-section summary::-webkit-details-marker { display: none; }
#history-section summary::before {
    content: '▶';
    font-size: 9px;
    transition: transform 0.15s;
}
#history-section[open] summary::before { transform: rotate(90deg); }
#history-section summary:hover { color: var(--text-muted); }

#history-log {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.log-entry {
    border-left: 2px solid var(--border-dim);
    padding: 5px 0 5px 12px;
}

.log-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
}

.log-n { font-size: 11px; min-width: 28px; }
.log-chips { font-size: 15px; font-weight: bold; min-width: 32px; }
.log-chips.win  { color: var(--win); }
.log-chips.loss { color: var(--loss); }
.log-chips.draw { color: var(--text-mid); }
.log-desc  { font-size: 12px; }
.log-row   { font-size: 12px; margin-top: 2px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

/* ── Multiplayer setup panel ───────────────────────────────────── */
#mp-setup {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 10px 14px;
    border: 1px solid var(--border-dim);
    border-radius: 5px;
    background: var(--mp-bg);
}

#mp-invite { font-size: 13px; color: var(--text-mid); }

#mp-join-row { display: flex; align-items: center; gap: 8px; }

#mp-join-input {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    width: 230px;
}
#mp-join-input:focus { border-color: var(--border-focus); }
#mp-join-input::placeholder { color: var(--text-faint); }

#mp-status-msg { font-size: 13px; color: var(--text-muted); }

#theme-btn {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    color: var(--text-muted);
    padding: 2px 4px;
    border-radius: 3px;
    transition: color 0.1s;
}
#theme-btn:hover { color: var(--text); }
</style>
</head>
<body>
<script>if(localStorage.getItem('theme')==='light')document.body.classList.add('light');</script>

<h1>Leduc Hold'em — Play vs Solver</h1>

<div id="controls">
    <select id="strategy-select" onchange="onStrategyChange(this.value)"></select>
    <button class="btn" id="start-btn" onclick="startGame(document.getElementById('strategy-select').value)">▶ Start</button>
    <button class="btn" id="stop-btn"      style="display:none" onclick="stopGame()">⏹ Stop</button>
    <button class="btn" id="new-session-btn" style="display:none" onclick="newSession()">↺ New Session</button>
    <span id="sep"></span>
    <span id="stats"></span>
    <span id="status"></span>
</div>

<div id="mp-setup" style="display:none">
    <div id="mp-invite" style="display:none"></div>
    <div id="mp-join-row">
        <input id="mp-join-input" placeholder="Peer ID or invite URL"
               onkeydown="if(event.key==='Enter')mpJoin()" />
        <button class="btn" onclick="mpJoin()">Join ▶</button>
    </div>
    <span id="mp-status-msg"></span>
</div>

<hr id="divider">

<div id="cards-row">
    <div class="card-slot">
        <label>You</label>
        <div id="card-human"></div>
    </div>
    <div class="card-slot">
        <label>Board</label>
        <div id="card-board"></div>
    </div>
    <div class="card-slot">
        <label>Opponent</label>
        <div id="card-opp"></div>
    </div>
</div>

<div id="game-info"></div>
<div id="result-area"></div>
<div id="actions-area"></div>

<details id="history-section">
    <summary>Hand history</summary>
    <div id="history-log"></div>
</details>

<button id="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀</button>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js"></script>
</body>
</html>
